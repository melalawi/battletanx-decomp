# Generated by `make readme` from config.toml. Do not edit by hand: `make readme` rewrites it and
# `make check` refuses it when it no longer matches. It uploads the committed progress report of
# every cartridge as the `<id>_report` artifact decomp.dev reads, and builds nothing.
name: progress-report
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/progress-report/us_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: us_report
          path: data/progress-report/us_report.json
          if-no-files-found: error
