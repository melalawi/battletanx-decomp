# Disassembly configuration for the North American cartridge, NUS-NBXE-0.
#
# Every boundary below was measured from the image itself; the measurement is recorded beside it
# so it can be rechecked rather than trusted. Addresses are ROM offsets unless named `vram`.
#
# The whole loaded program is one contiguous run: ROM 0x001000..0x0D7040 maps to RAM
# 0x80071000..0x80147040, so vram = rom + 0x80070000 throughout. Two independent readings agree
# on that mapping:
#   - the cartridge header's entrypoint at offset 0x08 is 0x80071000, and ROM 0x001000 is the
#     first word the boot code copies;
#   - the entry stub at 0x80071000 clears bss from 0x80147040 to 0x803C8880, and 0x80147040 is
#     exactly 0x80070000 + 0x0D7040, the end of the loaded run.
# Under this mapping 1173 distinct `jal` targets read out of the loaded run resolve inside
# 0x80071000..0x80147040, and the 62 that do not all come from words scanned inside the data
# ranges below, where `jal` is not an instruction at all.

name: battletanx
sha1: 535860d941738ac1210c20a9b80114fea0e0ff17

options:
  basename: battletanx
  target_path: ../../artifacts/roms/battletanx.us.z64
  base_path: .
  platform: n64

  # IDO, run with the N64 profile `-G0 -non_shared -mips2 -O2`. splat has no 5.3/7.1
  # distinction, so this key names the family; the release is pinned by the IDO block's pins in
  # config.toml, which names tools/ido/ido-7.1.sha256, and installed at artifacts/ido/7.1.
  #
  # Which of the two is settled, and 7.1 is the answer: docs/pinned-compiler-reach.md
  # compiles the authored sources against both and compares them with the image word for
  # word, and func_800E3460 and func_800E3470 reproduce under 7.1 and not under 5.3, which
  # is the one property no flag moves. The releases are indistinguishable on every other
  # property tested. Both are unable to produce 82.465% of this cartridge's code: 667 of
  # 1,276 intervals encode a register copy as `addu $d, $s, $zero` and neither release ever
  # emits that form, and 207 `mult` sites have no counterpart in either. Everything outside
  # 0x80110490..0x80124350 was built by GCC 2.7.2 with SN's ASN64 assembler, pinned as its own
  # [toolchains] block; data/object-toolchains.json names which compiler built each object.
  #
  # What is measured is in docs/evidence/toolchain-evidence.json, and two of its counts qualify the
  # description this comment used to carry. The return delay slot is not uniformly empty: of
  # 1775 returns, 1119 release the frame before an empty slot, 121 release it in the slot,
  # 12 release it before a filled one and 523 are frameless, so the axis stands at
  # `return-slot-mixed`. And `-G0` predicts no `$gp`-relative access at all, which the
  # survey confirms: the gp-relative-accesses count is 0 sites.
  compiler: IDO

  asm_path: ../../artifacts/us/extracted/asm
  src_path: ../../src
  build_path: ../../artifacts/us/extracted
  asset_path: ../../artifacts/us/extracted/assets

  create_asm_dependencies: true
  find_file_boundaries: true

  # Emit the linker script in split's original form, which places each subsegment where this file
  # lists it. The newer form groups the whole segment's .text, then its .data, then its .rodata,
  # and this cartridge does not hold them in that order: the entry stub at 0x001000 is text, the
  # run from 0x001038 to 0x006000 is data, and the text resumes at 0x006000. Grouping moves the
  # data run 0x1B50 bytes and every address in the image with it.
  ld_legacy_generation: True

  # Generated build products go under artifacts/, which is ignored in its entirety. Only the
  # configuration and the symbol lists below are kept in the tree.
  ld_script_path: ../../artifacts/us/extracted/battletanx.ld
  generated_asm_macros_directory: ../../artifacts/us/extracted/include

  symbol_addrs_path: symbol_addrs.txt
  undefined_funcs_auto_path: undefined_funcs_auto.txt
  undefined_syms_auto_path: undefined_syms_auto.txt

segments:
  - [0x000000, header, header]

  # IPL3. Nintendo's boot code, identical across cartridges and not this project's to rebuild.
  - [0x000040, bin, bootcode]

  - name: main
    type: code
    start: 0x001000
    vram: 0x80071000
    # 0x803C8880 - 0x80147040, read from the entry stub's clear loop bounds.
    bss_size: 0x281840
    subalign: 4
    subsegments:
      # The entry stub: set sp, clear bss, call into the program. Fourteen instructions, ending at
      # the `jal 0x800779CC` and its delay slot. The word after it is 0x0001008D, which is data.
      - [0x001000, asm, entry]

      # Data and read-only data placed ahead of the text. This ordering is the cartridge's, not a
      # mistake: 0x80071040 onward is a table of pointers into the text, followed by float and
      # double literals and by C strings ("Level %s", "Campaign", "MultiPlayer", and the build
      # host's own "d:\bs64\screenshot%d.raw"). None of it decodes as reachable code, and the run
      # ends at 0x80075FF8 with the "NaN"/"Inf" literals a float formatter uses.
      - [0x001038, data, data]

      # Text. Starts at 0x80076000, which is a clean function start: it opens a frame, saves ra,
      # and calls the two three-instruction coprocessor-0 leaves at 0x800771F4 and 0x80077200 --
      # the libultra interrupt-mask pair. Runs to the last `jr ra` in the image at 0x80125548 and
      # its delay slot; 1775 spans in this range end at a `jr ra` that carries its delay slot,
      # which is what docs/evidence/toolchain-evidence.json counts as a closed body.
      # BEGIN GENERATED FUNCTION SPLIT -- one subsegment per function, regenerated from the
      # split's own function boundaries. 1276 functions, from 0x80076000 to the last return at
      # 0x80125548.
      - [0x006000, asm, nonmatchings/func_80076000]
      - [0x006038, c, func_80076038]
      - [0x006068, asm, nonmatchings/func_80076068]
      - [0x0060A0, asm, nonmatchings/func_800760A0]
      - [0x0060DC, asm, nonmatchings/func_800760DC]
      - [0x006124, asm, nonmatchings/func_80076124]
